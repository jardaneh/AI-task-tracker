<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Board</title>
    <style>
        :root {
            color-scheme: light;
            font-family: Inter, "Segoe UI", Roboto, sans-serif;
            --surface: #f8fafc;
            --surface-strong: #ffffff;
            --border: #dfe7f1;
            --text: #0f172a;
            --muted: #64748b;
            --accent: #2563eb;
            --accent-soft: #dbeafe;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: linear-gradient(180deg, #f8fbff 0%, #eef4ff 100%);
            color: var(--text);
        }

        .app-header {
            padding: 2rem 1.5rem 1rem;
        }

        .app-header h1 {
            margin: 0 0 0.35rem;
            font-size: 2rem;
        }

        .app-header p {
            margin: 0;
            color: var(--muted);
            font-size: 1rem;
        }

        main {
            padding: 0 1.5rem 2rem;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(3, minmax(220px, 1fr));
            gap: 1rem;
            align-items: start;
        }

        .board-column {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 1rem;
            min-height: 320px;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.04);
        }

        .column-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.25rem;
        }

        .column-title {
            margin: 0;
            font-size: 1rem;
            font-weight: 700;
        }

        .column-count {
            background: var(--accent-soft);
            color: var(--accent);
            border-radius: 999px;
            padding: 0.25rem 0.6rem;
            font-size: 0.8rem;
            font-weight: 700;
        }

        .task-card {
            background: var(--surface-strong);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 0.9rem;
            box-shadow: 0 4px 12px rgba(15, 23, 42, 0.05);
        }

        .task-title {
            margin: 0 0 0.35rem;
            font-size: 1rem;
            font-weight: 700;
        }

        .task-description {
            margin: 0 0 0.75rem;
            color: var(--muted);
            font-size: 0.95rem;
            line-height: 1.4;
        }

        .task-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 0.8rem;
        }

        .task-pill {
            display: inline-flex;
            align-items: center;
            border-radius: 999px;
            padding: 0.3rem 0.6rem;
            font-size: 0.8rem;
            font-weight: 600;
            background: #f1f5f9;
            color: #334155;
        }

        .priority-high {
            background: #fee2e2;
            color: #b91c1c;
        }

        .priority-medium {
            background: #fef3c7;
            color: #b45309;
        }

        .priority-low {
            background: #dcfce7;
            color: #15803d;
        }

        .edit-button {
            border: none;
            border-radius: 999px;
            background: var(--accent);
            color: #ffffff;
            padding: 0.45rem 0.8rem;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
        }

        .edit-button:hover {
            background: #1d4ed8;
        }

        .task-card.is-dragging {
            opacity: 0.65;
            transform: rotate(2deg);
        }

        .board-column.drag-over {
            outline: 2px dashed var(--accent);
            background: #eff6ff;
        }

        .board-feedback {
            grid-column: 1 / -1;
            margin-bottom: 0.75rem;
            padding: 0.75rem 0.9rem;
            border-radius: 12px;
            border: 1px solid #fecaca;
            background: #fef2f2;
            color: #b91c1c;
            font-size: 0.95rem;
        }

        @media (max-width: 840px) {
            .board {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
  <header class="app-header">
    <div>
        <h1>Task Board</h1>
        <p>Drag tasks between columns to update their status.</p>
    </div>
  </header>

  <main>
    <section id="board" class="board" aria-live="polite"></section>
  </main>

  <script>
    const API_BASE = "http://localhost:8000";
    const STATUSES = ["ToDo", "InProgress", "Done"];
    const STATUS_LABELS = {
        ToDo: "To Do",
        InProgress: "In Progress",
        Done: "Done"
    };
    const PRIORITY_ORDER = { High: 0, Medium: 1, Low: 2 };

    let tasks = [];
    let boardState = "loading";
    let feedbackMessage = "";
    let draggedTaskId = null;

    function createElement(tagName, className) {
        const element = document.createElement(tagName);
        if (className) {
            element.className = className;
        }
        return element;
    }

    function getPriorityValue(priority) {
        return PRIORITY_ORDER[priority] ?? Number.MAX_SAFE_INTEGER;
    }

    function compareTaskIds(leftTask, rightTask) {
        const leftId = Number(leftTask.id);
        const rightId = Number(rightTask.id);

        if (!Number.isNaN(leftId) && !Number.isNaN(rightId)) {
            return leftId - rightId;
        }

        return String(leftTask.id).localeCompare(String(rightTask.id));
    }

    function sortTasksForStatus(taskList) {
        return [...taskList].sort((leftTask, rightTask) => {
            const priorityDifference = getPriorityValue(leftTask.priority) - getPriorityValue(rightTask.priority);
            if (priorityDifference !== 0) {
                return priorityDifference;
            }
            return compareTaskIds(leftTask, rightTask);
        });
    }

    function createFeedbackMessage(message) {
        if (!message) {
            return null;
        }

        const feedback = createElement("div", "board-feedback");
        feedback.textContent = message;
        return feedback;
    }

    function createTaskCard(task) {
        const card = createElement("article", "task-card");
        card.dataset.taskId = String(task.id);
        card.draggable = true;

        card.addEventListener("dragstart", (event) => {
            draggedTaskId = String(task.id);
            card.classList.add("is-dragging");
            if (event.dataTransfer) {
                event.dataTransfer.effectAllowed = "move";
                event.dataTransfer.setData("text/plain", String(task.id));
            }
        });

        card.addEventListener("dragend", () => {
            draggedTaskId = null;
            card.classList.remove("is-dragging");
            document.querySelectorAll(".board-column.drag-over").forEach((column) => {
                column.classList.remove("drag-over");
            });
        });

        const title = createElement("h3", "task-title");
        title.textContent = task.title;
        card.appendChild(title);

        if (task.description) {
            const description = createElement("p", "task-description");
            description.textContent = task.description;
            card.appendChild(description);
        }

        const meta = createElement("div", "task-meta");

        const priority = createElement("span", `task-pill priority-${String(task.priority).toLowerCase()}`);
        priority.textContent = task.priority;
        meta.appendChild(priority);

        const assignee = createElement("span", "task-pill");
        assignee.textContent = task.assignee || "Unassigned";
        meta.appendChild(assignee);

        card.appendChild(meta);

        const editButton = createElement("button", "edit-button");
        editButton.type = "button";
        editButton.textContent = "Edit";
        card.appendChild(editButton);

        return card;
    }

    function createEmptyPlaceholder() {
        const placeholder = createElement("div", "task-card");
        placeholder.dataset.emptyPlaceholder = "true";

        const message = createElement("p", "task-description");
        message.textContent = "No tasks in this column yet.";
        placeholder.appendChild(message);

        return placeholder;
    }

    function createLoadingState() {
        const stateCard = createElement("div", "task-card");

        const title = createElement("h3", "task-title");
        title.textContent = "Loading tasks…";
        stateCard.appendChild(title);

        const description = createElement("p", "task-description");
        description.textContent = "Fetching the latest task board data.";
        stateCard.appendChild(description);

        return stateCard;
    }

    function createErrorState() {
        const stateCard = createElement("div", "task-card");

        const title = createElement("h3", "task-title");
        title.textContent = "Unable to load tasks";
        stateCard.appendChild(title);

        const description = createElement("p", "task-description");
        description.textContent = "The board could not be refreshed. Please try again.";
        stateCard.appendChild(description);

        const retryButton = createElement("button", "edit-button");
        retryButton.type = "button";
        retryButton.textContent = "Retry";
        retryButton.addEventListener("click", () => {
            fetchTasks();
        });
        stateCard.appendChild(retryButton);

        return stateCard;
    }

    function createColumn(status, taskList) {
        const column = createElement("section", "board-column");
        column.dataset.status = status;

        column.addEventListener("dragover", (event) => {
            event.preventDefault();
            column.classList.add("drag-over");
        });

        column.addEventListener("dragleave", (event) => {
            if (!column.contains(event.relatedTarget)) {
                column.classList.remove("drag-over");
            }
        });

        column.addEventListener("drop", (event) => {
            event.preventDefault();
            column.classList.remove("drag-over");

            if (!draggedTaskId) {
                return;
            }

            const taskId = draggedTaskId;
            const targetStatus = column.dataset.status;
            const currentTask = tasks.find((task) => String(task.id) === String(taskId));

            if (!currentTask || currentTask.status === targetStatus) {
                draggedTaskId = null;
                return;
            }

            updateTaskStatus(taskId, targetStatus);
        });

        const header = createElement("div", "column-header");
        const title = createElement("h2", "column-title");
        title.textContent = STATUS_LABELS[status];
        header.appendChild(title);

        const count = createElement("span", "column-count");
        count.textContent = String(taskList.length);
        header.appendChild(count);

        column.appendChild(header);

        const taskListFragment = document.createDocumentFragment();
        if (taskList.length === 0) {
            taskListFragment.appendChild(createEmptyPlaceholder());
        } else {
            taskList.forEach((task) => {
                taskListFragment.appendChild(createTaskCard(task));
            });
        }

        column.appendChild(taskListFragment);
        return column;
    }

    function renderBoard(taskList) {
        tasks = Array.isArray(taskList) ? taskList : [];

        const board = document.getElementById("board");
        board.replaceChildren();

        if (boardState === "loading") {
            board.appendChild(createLoadingState());
            return;
        }

        if (boardState === "error") {
            board.appendChild(createErrorState());
            return;
        }

        const feedback = createFeedbackMessage(feedbackMessage);
        if (feedback) {
            board.appendChild(feedback);
        }

        STATUSES.forEach((status) => {
            const statusTasks = sortTasksForStatus(tasks.filter((task) => task.status === status));
            board.appendChild(createColumn(status, statusTasks));
        });
    }

    async function readErrorMessage(response) {
        const contentType = response.headers.get("content-type") || "";

        if (contentType.includes("application/json")) {
            try {
                const payload = await response.json();
                if (payload && typeof payload === "object") {
                    if (typeof payload.detail === "string") {
                        return payload.detail;
                    }
                    if (typeof payload.message === "string") {
                        return payload.message;
                    }
                    if (typeof payload.error === "string") {
                        return payload.error;
                    }
                }
            } catch (error) {
                console.error("Unable to parse error payload", error);
            }
        }

        try {
            const text = await response.text();
            if (text) {
                return text;
            }
        } catch (error) {
            console.error("Unable to read error response", error);
        }

        return "The task could not be moved. Please try again.";
    }

    async function updateTaskStatus(taskId, targetStatus) {
        const currentTask = tasks.find((task) => String(task.id) === String(taskId));
        if (!currentTask || currentTask.status === targetStatus) {
            return;
        }

        const previousTasks = tasks.map((task) => ({ ...task }));
        const optimisticTasks = tasks.map((task) => {
            if (String(task.id) === String(taskId)) {
                return { ...task, status: targetStatus };
            }
            return task;
        });

        tasks = optimisticTasks;
        feedbackMessage = "";
        boardState = tasks.length === 0 ? "empty" : "ready";
        renderBoard(tasks);

        try {
            const response = await fetch(`${API_BASE}/tasks/${encodeURIComponent(taskId)}`, {
                method: "PATCH",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ status: targetStatus })
            });

            if (!response.ok) {
                tasks = previousTasks;
                feedbackMessage = await readErrorMessage(response);
                boardState = tasks.length === 0 ? "empty" : "ready";
                renderBoard(tasks);
                return;
            }

            feedbackMessage = "";
            tasks = optimisticTasks;
            boardState = tasks.length === 0 ? "empty" : "ready";
            renderBoard(tasks);
        } catch (error) {
            console.error("Unable to update task status", error);
            tasks = previousTasks;
            feedbackMessage = "The task could not be moved because the server was unavailable. Please try again.";
            boardState = tasks.length === 0 ? "empty" : "ready";
            renderBoard(tasks);
        }
    }

    async function fetchTasks() {
        boardState = "loading";
        renderBoard(tasks);

        try {
            const response = await fetch(`${API_BASE}/tasks`);
            if (!response.ok) {
                throw new Error(`Request failed with status ${response.status}`);
            }

            const payload = await response.json();
            const loadedTasks = Array.isArray(payload) ? payload : payload.tasks || [];
            tasks = loadedTasks;
            boardState = loadedTasks.length === 0 ? "empty" : "ready";
            renderBoard(tasks);
        } catch (error) {
            console.error("Unable to load tasks", error);
            tasks = [];
            boardState = "error";
            renderBoard(tasks);
        }
    }

    fetchTasks();
  </script>
</body>
</html>
