<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Board</title>
    <style>
        :root {
            color-scheme: light;
            font-family: Inter, "Segoe UI", Roboto, sans-serif;
            --surface: #f8fafc;
            --surface-strong: #ffffff;
            --border: #dfe7f1;
            --text: #0f172a;
            --muted: #64748b;
            --accent: #2563eb;
            --accent-soft: #dbeafe;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: linear-gradient(180deg, #f8fbff 0%, #eef4ff 100%);
            color: var(--text);
        }

        .app-header {
            padding: 2rem 1.5rem 1rem;
        }

        .app-header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
        }

        .app-header h1 {
            margin: 0 0 0.35rem;
            font-size: 2rem;
        }

        .app-header p {
            margin: 0;
            color: var(--muted);
            font-size: 1rem;
        }

        .new-task-button {
            min-width: 110px;
        }

        .app-header-actions {
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
        }

        .task-card-actions {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            margin-top: 0.75rem;
        }

        .activity-filter-form {
            display: flex;
            flex-direction: column;
            gap: 0.85rem;
            margin-bottom: 1rem;
        }

        .activity-filter-grid {
            grid-template-columns: repeat(4, minmax(0, 1fr));
        }

        .activity-table-wrapper {
            overflow: auto;
            border: 1px solid var(--border);
            border-radius: 12px;
        }

        .activity-table {
            width: 100%;
            border-collapse: collapse;
            background: #ffffff;
            min-width: 700px;
        }

        .activity-table th,
        .activity-table td {
            padding: 0.75rem 0.85rem;
            border-bottom: 1px solid var(--border);
            text-align: left;
            vertical-align: top;
            font-size: 0.92rem;
        }

        .activity-table th {
            background: #f8fafc;
            color: var(--muted);
            font-weight: 700;
            position: sticky;
            top: 0;
            z-index: 1;
        }

        .activity-table tbody tr:last-child td {
            border-bottom: none;
        }

        .activity-empty-state {
            color: var(--muted);
            font-style: italic;
        }

        main {
            padding: 0 1.5rem 2rem;
        }

        .modal {
            position: fixed;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            z-index: 50;
        }

        .modal.is-open {
            display: flex;
        }

        .modal-overlay {
            position: absolute;
            inset: 0;
            background: rgba(15, 23, 42, 0.45);
        }

        .modal-panel {
            position: relative;
            width: min(100%, 560px);
            background: var(--surface-strong);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 1.25rem;
            box-shadow: 0 20px 60px rgba(15, 23, 42, 0.15);
        }

        .activity-modal-panel {
            width: min(100%, 960px);
            max-height: min(90vh, 760px);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .modal-header h2 {
            margin: 0;
            font-size: 1.2rem;
        }

        .modal-close-button {
            border: none;
            background: transparent;
            color: var(--muted);
            font-size: 1.4rem;
            cursor: pointer;
        }

        .task-form {
            display: flex;
            flex-direction: column;
            gap: 0.85rem;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 0.85rem;
        }

        .form-field {
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
        }

        .form-field.full-width {
            grid-column: 1 / -1;
        }

        .form-field label {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text);
        }

        .form-field input,
        .form-field textarea,
        .form-field select {
            width: 100%;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 0.7rem 0.8rem;
            font: inherit;
            color: var(--text);
            background: #ffffff;
        }

        .form-field textarea {
            min-height: 96px;
            resize: vertical;
        }

        .field-error {
            min-height: 1rem;
            font-size: 0.8rem;
            color: #b91c1c;
        }

        .form-banner {
            display: none;
            padding: 0.75rem 0.85rem;
            border-radius: 12px;
            border: 1px solid #fecaca;
            background: #fef2f2;
            color: #b91c1c;
            font-size: 0.95rem;
        }

        .form-banner.is-visible {
            display: block;
        }

        .form-actions {
            display: flex;
            justify-content: flex-end;
            gap: 0.75rem;
            margin-top: 0.25rem;
        }

        .filter-panel {
            width: min(100%, 1280px);
            margin: 0 0 1rem;
            padding: 1rem;
            border: 1px solid var(--border);
            border-radius: 16px;
            background: var(--surface-strong);
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.04);
        }

        .filter-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 0.85rem;
            align-items: end;
        }

        .filter-field {
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
        }

        .filter-field label {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text);
        }

        .filter-field input,
        .filter-field select {
            width: 100%;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 0.7rem 0.8rem;
            font: inherit;
            color: var(--text);
            background: #ffffff;
        }

        .filter-actions {
            display: flex;
            justify-content: flex-end;
            gap: 0.75rem;
            margin-top: 1rem;
            flex-wrap: wrap;
        }

        .filter-button {
            min-width: 120px;
        }

        .secondary-button {
            border: none;
            border-radius: 999px;
            background: #e2e8f0;
            color: var(--text);
            padding: 0.5rem 0.9rem;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
        }

        .secondary-button:hover {
            background: #cbd5e1;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(3, minmax(220px, 1fr));
            gap: 1rem;
            align-items: start;
        }

        .board-column {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 1rem;
            min-height: 320px;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.04);
        }

        .column-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.25rem;
        }

        .column-title {
            margin: 0;
            font-size: 1rem;
            font-weight: 700;
        }

        .column-count {
            background: var(--accent-soft);
            color: var(--accent);
            border-radius: 999px;
            padding: 0.25rem 0.6rem;
            font-size: 0.8rem;
            font-weight: 700;
        }

        .task-card {
            background: var(--surface-strong);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 0.9rem;
            box-shadow: 0 4px 12px rgba(15, 23, 42, 0.05);
        }

        .task-title {
            margin: 0 0 0.35rem;
            font-size: 1rem;
            font-weight: 700;
        }

        .task-description {
            margin: 0 0 0.75rem;
            color: var(--muted);
            font-size: 0.95rem;
            line-height: 1.4;
        }

        .task-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 0.8rem;
        }

        .task-pill {
            display: inline-flex;
            align-items: center;
            border-radius: 999px;
            padding: 0.3rem 0.6rem;
            font-size: 0.8rem;
            font-weight: 600;
            background: #f1f5f9;
            color: #334155;
        }

        .priority-high {
            background: #fee2e2;
            color: #b91c1c;
        }

        .priority-medium {
            background: #fef3c7;
            color: #b45309;
        }

        .priority-low {
            background: #dcfce7;
            color: #15803d;
        }

        .edit-button {
            border: none;
            border-radius: 999px;
            background: var(--accent);
            color: #ffffff;
            padding: 0.45rem 0.8rem;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
        }

        .edit-button:hover {
            background: #1d4ed8;
        }

        .task-card.is-dragging {
            opacity: 0.65;
            transform: rotate(2deg);
        }

        .board-column.drag-over {
            outline: 2px dashed var(--accent);
            background: #eff6ff;
        }

        .board-feedback {
            grid-column: 1 / -1;
            margin-bottom: 0.75rem;
            padding: 0.75rem 0.9rem;
            border-radius: 12px;
            border: 1px solid #fecaca;
            background: #fef2f2;
            color: #b91c1c;
            font-size: 0.95rem;
        }

        @media (max-width: 840px) {
            .board {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
  <header class="app-header">
    <div class="app-header-content">
        <div>
            <h1>Task Board</h1>
            <p>Drag tasks between columns to update their status.</p>
        </div>
        <div class="app-header-actions">
            <button id="activity-log-button" class="secondary-button new-task-button" type="button">Activity Log</button>
            <button id="new-task-button" class="edit-button new-task-button" type="button">New Task</button>
        </div>
    </div>
  </header>

  <main>
    <section class="filter-panel" aria-label="Task filters">
      <div class="filter-grid">
        <div class="filter-field">
          <label for="filter-status-select">Status</label>
          <select id="filter-status-select" name="status">
            <option value="">All</option>
          </select>
        </div>
        <div class="filter-field">
          <label for="filter-priority-select">Priority</label>
          <select id="filter-priority-select" name="priority">
            <option value="">All</option>
          </select>
        </div>
        <div class="filter-field">
          <label for="filter-assignee-input">Assignee</label>
          <input id="filter-assignee-input" name="assignee" type="text" maxlength="50" />
        </div>
        <div class="filter-field">
          <label for="filter-title-input">Title/Details</label>
          <input id="filter-title-input" name="title" type="text" maxlength="100" />
        </div>
      </div>
      <div class="filter-actions">
        <button id="clear-filter-button" class="secondary-button filter-button" type="button">Clear Filter</button>
        <button id="apply-filter-button" class="edit-button filter-button" type="button">Apply Filter</button>
      </div>
    </section>
    <section id="board" class="board" aria-live="polite"></section>
  </main>

  <div id="task-modal" class="modal" aria-hidden="true" role="dialog" aria-labelledby="task-modal-title">
    <div class="modal-overlay" data-close-modal="true"></div>
    <div class="modal-panel">
      <div class="modal-header">
        <h2 id="task-modal-title">New Task</h2>
        <button id="modal-close-button" class="modal-close-button" type="button" aria-label="Close dialog">×</button>
      </div>
      <form id="task-form" class="task-form">
        <input id="task-id" name="taskId" type="hidden" />
        <div id="form-banner" class="form-banner" role="alert"></div>
        <div class="form-grid">
          <div class="form-field full-width">
            <label for="task-title-input">Title</label>
            <input id="task-title-input" name="title" type="text" maxlength="120" />
            <div id="error-title" class="field-error" aria-live="polite"></div>
          </div>
          <div class="form-field full-width">
            <label for="task-description-input">Description</label>
            <textarea id="task-description-input" name="description"></textarea>
            <div id="error-description" class="field-error" aria-live="polite"></div>
          </div>
          <div class="form-field">
            <label for="task-status-select">Status</label>
            <select id="task-status-select" name="status">
              <option value="ToDo">To Do</option>
              <option value="InProgress">In Progress</option>
              <option value="Done">Done</option>
            </select>
            <div id="error-status" class="field-error" aria-live="polite"></div>
          </div>
          <div class="form-field">
            <label for="task-priority-select">Priority</label>
            <select id="task-priority-select" name="priority">
              <option value="High">High</option>
              <option value="Medium">Medium</option>
              <option value="Low">Low</option>
            </select>
            <div id="error-priority" class="field-error" aria-live="polite"></div>
          </div>
          <div class="form-field full-width">
            <label for="task-assignee-input">Assignee</label>
            <input id="task-assignee-input" name="assignee" type="text" maxlength="80" />
            <div id="error-assignee" class="field-error" aria-live="polite"></div>
          </div>
        </div>
        <div class="form-actions">
          <button id="modal-cancel-button" class="secondary-button" type="button" data-close-modal="true">Cancel</button>
          <button class="edit-button" type="submit">Save</button>
        </div>
      </form>
    </div>
  </div>

  <div id="activity-modal" class="modal" aria-hidden="true" role="dialog" aria-labelledby="activity-modal-title">
    <div class="modal-overlay" data-close-modal="true"></div>
    <div class="modal-panel activity-modal-panel">
      <div class="modal-header">
        <h2 id="activity-modal-title">Activity Log</h2>
        <button id="activity-modal-close-button" class="modal-close-button" type="button" aria-label="Close dialog">×</button>
      </div>
      <form id="activity-filter-form" class="activity-filter-form">
        <div class="form-grid activity-filter-grid">
          <div class="form-field">
            <label for="activity-task-id-input">Task Id</label>
            <input id="activity-task-id-input" name="task" type="text" maxlength="120" />
          </div>
          <div class="form-field">
            <label for="activity-start-input">Start</label>
            <input id="activity-start-input" name="start" type="text" placeholder="2024-01-01T00:00:00" />
          </div>
          <div class="form-field">
            <label for="activity-end-input">End</label>
            <input id="activity-end-input" name="end" type="text" placeholder="2024-01-01T23:59:59" />
          </div>
          <div class="form-field">
            <label for="activity-type-select">Type</label>
            <select id="activity-type-select" name="type">
              <option value="">All</option>
              <option value="create">Create</option>
              <option value="update">Update</option>
              <option value="status-update">Status Update</option>
              <option value="delete">Delete</option>
            </select>
          </div>
        </div>
        <div class="form-actions">
          <button id="activity-clear-filter-button" class="secondary-button" type="button">Clear Filter</button>
          <button id="activity-apply-filter-button" class="edit-button" type="button">Apply Filter</button>
        </div>
      </form>
      <div class="activity-table-wrapper">
        <table class="activity-table">
          <thead>
            <tr>
              <th>Timestamp</th>
              <th>Type</th>
              <th>Details</th>
            </tr>
          </thead>
          <tbody id="activity-table-body"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = "http://localhost:8000";
    const STATUSES = ["ToDo", "InProgress", "Done"];
    const STATUS_OPTIONS = [
        { value: "", label: "All" },
        { value: "ToDo", label: "To Do" },
        { value: "InProgress", label: "In Progress" },
        { value: "Done", label: "Done" }
    ];
    const PRIORITY_OPTIONS = [
        { value: "", label: "All" },
        { value: "High", label: "High" },
        { value: "Medium", label: "Medium" },
        { value: "Low", label: "Low" }
    ];
    const STATUS_LABELS = {
        ToDo: "To Do",
        InProgress: "In Progress",
        Done: "Done"
    };
    const PRIORITY_ORDER = { High: 0, Medium: 1, Low: 2 };

    let taskCollection = [];
    let boardDisplayState = "loading";
    let feedbackNotice = "";
    let draggedTaskIdentifier = null;
    let modalViewState = {
        isOpen: false,
        mode: "create",
        taskId: null
    };
    let activityModalState = {
        isOpen: false
    };

    const modal = document.getElementById("task-modal");
    const modalTitle = document.getElementById("task-modal-title");
    const modalCloseButton = document.getElementById("modal-close-button");
    const modalCancelButton = document.getElementById("modal-cancel-button");
    const modalForm = document.getElementById("task-form");
    const modalTaskId = document.getElementById("task-id");
    const modalTitleInput = document.getElementById("task-title-input");
    const modalDescriptionInput = document.getElementById("task-description-input");
    const modalStatusSelect = document.getElementById("task-status-select");
    const modalPrioritySelect = document.getElementById("task-priority-select");
    const modalAssigneeInput = document.getElementById("task-assignee-input");
    const formBanner = document.getElementById("form-banner");
    const newTaskButton = document.getElementById("new-task-button");
    const activityLogButton = document.getElementById("activity-log-button");
    const filterStatusSelect = document.getElementById("filter-status-select");
    const filterPrioritySelect = document.getElementById("filter-priority-select");
    const filterAssigneeInput = document.getElementById("filter-assignee-input");
    const filterTitleInput = document.getElementById("filter-title-input");
    const clearFilterButton = document.getElementById("clear-filter-button");
    const applyFilterButton = document.getElementById("apply-filter-button");
    const activityModal = document.getElementById("activity-modal");
    const activityModalCloseButton = document.getElementById("activity-modal-close-button");
    const activityFilterForm = document.getElementById("activity-filter-form");
    const activityTaskIdInput = document.getElementById("activity-task-id-input");
    const activityStartInput = document.getElementById("activity-start-input");
    const activityEndInput = document.getElementById("activity-end-input");
    const activityTypeSelect = document.getElementById("activity-type-select");
    const activityClearFilterButton = document.getElementById("activity-clear-filter-button");
    const activityApplyFilterButton = document.getElementById("activity-apply-filter-button");
    const activityTableBody = document.getElementById("activity-table-body");

    function createElement(tagName, className) {
        const element = document.createElement(tagName);
        if (className) {
            element.className = className;
        }
        return element;
    }

    function getPriorityValue(priority) {
        return PRIORITY_ORDER[priority] ?? Number.MAX_SAFE_INTEGER;
    }

    function compareTaskIds(leftTask, rightTask) {
        const leftId = Number(leftTask.id);
        const rightId = Number(rightTask.id);

        if (!Number.isNaN(leftId) && !Number.isNaN(rightId)) {
            return leftId - rightId;
        }

        return String(leftTask.id).localeCompare(String(rightTask.id));
    }

    function compareTasksByPriority(leftTask, rightTask) {
        const priorityDifference = getPriorityValue(leftTask.priority) - getPriorityValue(rightTask.priority);
        if (priorityDifference !== 0) {
            return priorityDifference;
        }

        return compareTaskIds(leftTask, rightTask);
    }

    function sortTasksForStatus(taskList) {
        return [...taskList].sort(compareTasksByPriority);
    }

    function createFeedbackMessage(message) {
        if (!message) {
            return null;
        }

        const feedback = createElement("div", "board-feedback");
        feedback.textContent = message;
        return feedback;
    }

    function populateSelectOptions(selectElement, optionConfigs) {
        selectElement.replaceChildren();
        optionConfigs.forEach(function appendOption(optionConfig) {
            const option = createElement("option");
            option.value = optionConfig.value;
            option.textContent = optionConfig.label;
            selectElement.appendChild(option);
        });
    }

    function buildTaskQueryString() {
        const query = new URLSearchParams();

        if (filterStatusSelect.value) {
            query.set("status", filterStatusSelect.value);
        }
        if (filterPrioritySelect.value) {
            query.set("priority", filterPrioritySelect.value);
        }
        if (filterAssigneeInput.value.trim()) {
            query.set("assignee", filterAssigneeInput.value.trim());
        }
        if (filterTitleInput.value.trim()) {
            query.set("text", filterTitleInput.value.trim());
        }

        const queryString = query.toString();
        return queryString ? `?${queryString}` : "";
    }

    function handleTaskCardDragStart(event) {
        const cardElement = event.currentTarget;
        draggedTaskIdentifier = String(cardElement.dataset.taskId);
        cardElement.classList.add("is-dragging");
        if (event.dataTransfer) {
            event.dataTransfer.effectAllowed = "move";
            event.dataTransfer.setData("text/plain", String(cardElement.dataset.taskId));
        }
    }

    function handleTaskCardDragEnd(event) {
        const cardElement = event.currentTarget;
        draggedTaskIdentifier = null;
        cardElement.classList.remove("is-dragging");
        document.querySelectorAll(".board-column.drag-over").forEach(removeDragOverHighlight);
    }

    function removeDragOverHighlight(columnElement) {
        columnElement.classList.remove("drag-over");
    }

    function handleTaskCardEditClick(event, task) {
        event.stopPropagation();
        openTaskModal("edit", task);
    }

    function handleTaskCardActivityClick(event, task) {
        event.stopPropagation();
        openActivityModal(task.id);
    }

    function createTaskCard(task) {
        const card = createElement("article", "task-card");
        card.dataset.taskId = String(task.id);
        card.draggable = true;

        card.ondragstart = handleTaskCardDragStart;
        card.ondragend = handleTaskCardDragEnd;

        const title = createElement("h3", "task-title");
        title.textContent = task.title;
        card.appendChild(title);

        if (task.description) {
            const description = createElement("p", "task-description");
            description.textContent = task.description;
            card.appendChild(description);
        }

        const meta = createElement("div", "task-meta");

        const priority = createElement("span", `task-pill priority-${String(task.priority).toLowerCase()}`);
        priority.textContent = task.priority;
        meta.appendChild(priority);

        const assignee = createElement("span", "task-pill");
        assignee.textContent = task.assignee || "Unassigned";
        meta.appendChild(assignee);

        card.appendChild(meta);

        const actions = createElement("div", "task-card-actions");

        const editButton = createElement("button", "edit-button");
        editButton.type = "button";
        editButton.textContent = "Edit";
        editButton.onclick = function handleTaskEditButtonClick(event) {
            handleTaskCardEditClick(event, task);
        };
        actions.appendChild(editButton);

        const activityButton = createElement("button", "secondary-button");
        activityButton.type = "button";
        activityButton.textContent = "Activity Log";
        activityButton.onclick = function handleTaskActivityButtonClick(event) {
            handleTaskCardActivityClick(event, task);
        };
        actions.appendChild(activityButton);

        card.appendChild(actions);

        return card;
    }

    function createEmptyPlaceholder() {
        const placeholder = createElement("div", "task-card");
        placeholder.dataset.emptyPlaceholder = "true";

        const message = createElement("p", "task-description");
        message.textContent = "No tasks in this column yet.";
        placeholder.appendChild(message);

        return placeholder;
    }

    function createLoadingState() {
        const stateCard = createElement("div", "task-card");

        const title = createElement("h3", "task-title");
        title.textContent = "Loading tasks…";
        stateCard.appendChild(title);

        const description = createElement("p", "task-description");
        description.textContent = "Fetching the latest task board data.";
        stateCard.appendChild(description);

        return stateCard;
    }

    function createErrorState() {
        const stateCard = createElement("div", "task-card");

        const title = createElement("h3", "task-title");
        title.textContent = "Unable to load tasks";
        stateCard.appendChild(title);

        const description = createElement("p", "task-description");
        description.textContent = "The board could not be refreshed. Please try again.";
        stateCard.appendChild(description);

        const retryButton = createElement("button", "edit-button");
        retryButton.type = "button";
        retryButton.textContent = "Retry";
        retryButton.onclick = handleTaskRefreshClick;
        stateCard.appendChild(retryButton);

        return stateCard;
    }

    function handleTaskRefreshClick() {
        fetchTasks(buildTaskQueryString());
    }

    function handleBoardColumnDragOver(event) {
        event.preventDefault();
        event.currentTarget.classList.add("drag-over");
    }

    function handleBoardColumnDragLeave(event) {
        if (!event.currentTarget.contains(event.relatedTarget)) {
            event.currentTarget.classList.remove("drag-over");
        }
    }

    function handleBoardColumnDrop(event) {
        event.preventDefault();
        const columnElement = event.currentTarget;
        columnElement.classList.remove("drag-over");

        if (!draggedTaskIdentifier) {
            return;
        }

        const targetStatus = columnElement.dataset.status;
        const currentTask = findTaskById(draggedTaskIdentifier);

        if (!currentTask || currentTask.status === targetStatus) {
            draggedTaskIdentifier = null;
            return;
        }

        updateTaskStatus(draggedTaskIdentifier, targetStatus);
    }

    function findTaskById(taskIdentifier) {
        return taskCollection.find(function findMatchingTask(task) {
            return String(task.id) === String(taskIdentifier);
        });
    }

    function createColumn(status, taskList) {
        const column = createElement("section", "board-column");
        column.dataset.status = status;

        column.ondragover = handleBoardColumnDragOver;
        column.ondragleave = handleBoardColumnDragLeave;
        column.ondrop = handleBoardColumnDrop;

        const header = createElement("div", "column-header");
        const title = createElement("h2", "column-title");
        title.textContent = STATUS_LABELS[status];
        header.appendChild(title);

        const count = createElement("span", "column-count");
        count.textContent = String(taskList.length);
        header.appendChild(count);

        column.appendChild(header);

        const taskListFragment = document.createDocumentFragment();
        if (taskList.length === 0) {
            taskListFragment.appendChild(createEmptyPlaceholder());
        } else {
            taskList.forEach(function appendTaskCard(task) {
                taskListFragment.appendChild(createTaskCard(task));
            });
        }

        column.appendChild(taskListFragment);
        return column;
    }

    function renderBoard(taskList) {
        taskCollection = Array.isArray(taskList) ? taskList : [];

        const board = document.getElementById("board");
        board.replaceChildren();

        if (boardDisplayState === "loading") {
            board.appendChild(createLoadingState());
            return;
        }

        if (boardDisplayState === "error") {
            board.appendChild(createErrorState());
            return;
        }

        const feedback = createFeedbackMessage(feedbackNotice);
        if (feedback) {
            board.appendChild(feedback);
        }

        STATUSES.forEach(function appendStatusColumn(status) {
            const statusTasks = sortTasksForStatus(taskCollection.filter(createTaskStatusFilter(status)));
            board.appendChild(createColumn(status, statusTasks));
        });
    }

    function createTaskStatusFilter(status) {
        return function filterTaskByStatus(task) {
            return task.status === status;
        };
    }

    function clearFormErrors() {
        document.querySelectorAll(".field-error").forEach(resetFieldErrorMessage);
        formBanner.textContent = "";
        formBanner.classList.remove("is-visible");
    }

    function resetFieldErrorMessage(fieldError) {
        fieldError.textContent = "";
    }

    function setFieldError(fieldName, message) {
        const errorElement = document.getElementById(`error-${fieldName}`);
        if (errorElement) {
            errorElement.textContent = message;
        }
    }

    function showFormBanner(message) {
        if (!message) {
            formBanner.textContent = "";
            formBanner.classList.remove("is-visible");
            return;
        }

        formBanner.textContent = message;
        formBanner.classList.add("is-visible");
    }

    function resetTaskForm() {
        modalForm.reset();
        modalTaskId.value = "";
        modalTitleInput.value = "";
        modalDescriptionInput.value = "";
        modalStatusSelect.value = "ToDo";
        modalPrioritySelect.value = "Medium";
        modalAssigneeInput.value = "";
        clearFormErrors();
    }

    function closeTaskModal() {
        modal.classList.remove("is-open");
        modal.setAttribute("aria-hidden", "true");
        modalViewState.isOpen = false;
        modalViewState.mode = "create";
        modalViewState.taskId = null;
        resetTaskForm();
    }

    function openTaskModal(mode, task) {
        modalViewState.isOpen = true;
        modalViewState.mode = mode;
        modalViewState.taskId = task ? String(task.id) : null;
        modalTitle.textContent = mode === "edit" ? "Edit Task" : "New Task";
        resetTaskForm();

        if (mode === "edit" && task) {
            modalTaskId.value = String(task.id);
            modalTitleInput.value = task.title || "";
            modalDescriptionInput.value = task.description || "";
            modalStatusSelect.value = task.status || "ToDo";
            modalPrioritySelect.value = task.priority || "Medium";
            modalAssigneeInput.value = task.assignee || "";
        }

        modal.classList.add("is-open");
        modal.setAttribute("aria-hidden", "false");
        window.requestAnimationFrame(function focusTaskTitleInput() {
            modalTitleInput.focus();
        });
    }

    function getErrorMessage(payload) {
        if (!payload || typeof payload !== "object") {
            return "The task could not be saved. Please try again.";
        }

        if (Array.isArray(payload.detail)) {
            const messages = payload.detail
                .map(extractErrorMessage)
                .filter(Boolean);

            if (messages.length > 0) {
                return messages.join(" ");
            }
        }

        if (typeof payload.detail === "string") {
            return payload.detail;
        }
        if (typeof payload.message === "string") {
            return payload.message;
        }
        if (typeof payload.error === "string") {
            return payload.error;
        }

        return "The task could not be saved. Please try again.";
    }

    function extractErrorMessage(item) {
        if (item && typeof item === "object") {
            if (typeof item.msg === "string") {
                return item.msg;
            }
            if (typeof item.message === "string") {
                return item.message;
            }
            if (typeof item.error === "string") {
                return item.error;
            }
        }

        return null;
    }

    function getFieldErrors(payload) {
        if (!payload || typeof payload !== "object") {
            return {};
        }

        if (!Array.isArray(payload.detail)) {
            return {};
        }

        return payload.detail.reduce(collectFieldErrors, {});
    }

    function collectFieldErrors(fieldErrors, item) {
        if (!item || typeof item !== "object") {
            return fieldErrors;
        }

        const location = Array.isArray(item.loc) ? item.loc : [];
        const fieldName = typeof location[location.length - 1] === "string"
            ? location[location.length - 1]
            : null;
        const errorMessage = typeof item.msg === "string"
            ? item.msg
            : typeof item.message === "string"
                ? item.message
                : typeof item.error === "string"
                    ? item.error
                    : null;

        if (fieldName && errorMessage) {
            fieldErrors[fieldName] = errorMessage;
        }

        return fieldErrors;
    }

    async function readErrorPayload(response) {
        const contentType = response.headers.get("content-type") || "";
        const fallbackMessage = "The task could not be saved. Please try again.";

        if (contentType.includes("application/json")) {
            try {
                const payload = await response.clone().json();
                return {
                    message: getErrorMessage(payload),
                    fieldErrors: getFieldErrors(payload)
                };
            } catch (error) {
                console.error("Unable to parse error payload", error);
            }
        }

        try {
            const text = await response.clone().text();
            if (text) {
                return { message: text, fieldErrors: {} };
            }
        } catch (error) {
            console.error("Unable to read error response", error);
        }

        return { message: fallbackMessage, fieldErrors: {} };
    }

    function updateBoardDisplayState(nextBoardState, nextFeedbackNotice) {
        boardDisplayState = nextBoardState;
        feedbackNotice = nextFeedbackNotice;
        renderBoard(taskCollection);
    }

    async function updateTaskStatus(taskId, targetStatus) {
        const currentTask = findTaskById(taskId);
        if (!currentTask || currentTask.status === targetStatus) {
            return;
        }

        const previousTasks = taskCollection.map(cloneTask);
        const optimisticTasks = taskCollection.map(function applyStatusUpdate(task) {
            if (String(task.id) === String(taskId)) {
                return { ...task, status: targetStatus };
            }
            return task;
        });

        taskCollection = optimisticTasks;
        updateBoardDisplayState(taskCollection.length === 0 ? "empty" : "ready", "");

        try {
            const response = await fetch(`${API_BASE}/tasks/${encodeURIComponent(taskId)}`, {
                method: "PATCH",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ status: targetStatus })
            });

            if (!response.ok) {
                taskCollection = previousTasks;
                const errorPayload = await readErrorPayload(response);
                updateBoardDisplayState(taskCollection.length === 0 ? "empty" : "ready", errorPayload.message);
                return;
            }

            taskCollection = optimisticTasks;
            updateBoardDisplayState(taskCollection.length === 0 ? "empty" : "ready", "");
        } catch (error) {
            console.error("Unable to update task status", error);
            taskCollection = previousTasks;
            updateBoardDisplayState(taskCollection.length === 0 ? "empty" : "ready", "The task could not be moved because the server was unavailable. Please try again.");
        }
    }

    function cloneTask(task) {
        return { ...task };
    }

    async function submitTaskForm(event) {
        event.preventDefault();
        clearFormErrors();

        const title = modalTitleInput.value.trim();
        if (!title) {
            setFieldError("title", "Title is required");
            modalTitleInput.focus();
            return;
        }

        const isEdit = modalViewState.mode === "edit";
        const currentTask = isEdit ? findTaskById(modalTaskId.value || "") : null;
        const formPayload = {
            title,
            description: modalDescriptionInput.value,
            priority: modalPrioritySelect.value,
            assignee: modalAssigneeInput.value.trim() ? modalAssigneeInput.value.trim() : null
        };

        if (!isEdit) {
            formPayload.status = modalStatusSelect.value;
        } else if (currentTask && modalStatusSelect.value !== currentTask.status) {
            formPayload.status = modalStatusSelect.value;
        }

        const requestUrl = isEdit
            ? `${API_BASE}/tasks/${encodeURIComponent(modalTaskId.value || "")}`
            : `${API_BASE}/tasks`;

        try {
            const response = await fetch(requestUrl, {
                method: isEdit ? "PATCH" : "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(formPayload)
            });

            if (!response.ok) {
                const errorPayload = await readErrorPayload(response);
                if (response.status === 422) {
                    const fieldErrors = errorPayload.fieldErrors || {};
                    if (fieldErrors.title) {
                        setFieldError("title", fieldErrors.title);
                    }
                    if (fieldErrors.description) {
                        setFieldError("description", fieldErrors.description);
                    }
                    if (fieldErrors.status) {
                        setFieldError("status", fieldErrors.status);
                    }
                    if (fieldErrors.priority) {
                        setFieldError("priority", fieldErrors.priority);
                    }
                    if (fieldErrors.assignee) {
                        setFieldError("assignee", fieldErrors.assignee);
                    }
                    if (!Object.keys(fieldErrors).length) {
                        showFormBanner(errorPayload.message);
                    }
                } else {
                    showFormBanner(errorPayload.message);
                }
                return;
            }

            closeTaskModal();
            feedbackNotice = "";
            await fetchTasks();
        } catch (error) {
            console.error("Unable to save task", error);
            showFormBanner("The task could not be saved because the server was unavailable. Please try again.");
        }
    }

    async function fetchTasks(queryString = "") {
        boardDisplayState = "loading";
        renderBoard(taskCollection);

        try {
            const response = await fetch(`${API_BASE}/tasks${queryString}`);
            if (!response.ok) {
                throw new Error(`Request failed with status ${response.status}`);
            }

            const payload = await response.json();
            const loadedTasks = Array.isArray(payload) ? payload : payload.tasks || [];
            taskCollection = loadedTasks;
            boardDisplayState = loadedTasks.length === 0 ? "empty" : "ready";
            renderBoard(taskCollection);
        } catch (error) {
            console.error("Unable to load tasks", error);
            taskCollection = [];
            boardDisplayState = "error";
            renderBoard(taskCollection);
        }
    }

    function handleApplyFilterClick() {
        fetchTasks(buildTaskQueryString());
    }

    function handleClearFilterClick() {
        filterStatusSelect.value = "";
        filterPrioritySelect.value = "";
        filterAssigneeInput.value = "";
        filterTitleInput.value = "";
        fetchTasks();
    }

    function handleNewTaskButtonClick() {
        openTaskModal("create");
    }

    function closeActivityModal() {
        activityModal.classList.remove("is-open");
        activityModal.setAttribute("aria-hidden", "true");
        activityModalState.isOpen = false;
    }

    function openActivityModal(taskId) {
        activityModalState.isOpen = true;
        if (typeof taskId === "string" && taskId) {
            activityTaskIdInput.value = taskId;
        } else {
            activityTaskIdInput.value = "";
        }
        activityStartInput.value = "";
        activityEndInput.value = "";
        activityTypeSelect.value = "";
        activityModal.classList.add("is-open");
        activityModal.setAttribute("aria-hidden", "false");
        window.requestAnimationFrame(function focusActivityTaskInput() {
            activityTaskIdInput.focus();
        });
        fetchActivityLog();
    }

    function createActivityRow(entry) {
        const row = createElement("tr");
        const timestampCell = createElement("td");
        const typeCell = createElement("td");
        const detailsCell = createElement("td");

        timestampCell.textContent = entry.timestamp ? new Date(entry.timestamp).toLocaleString() : "";
        typeCell.textContent = entry.type || "";
        if (typeof entry.details === "string") {
            detailsCell.textContent = entry.details;
        } else {
            detailsCell.textContent = entry.details ? JSON.stringify(entry.details) : "";
        }

        row.appendChild(timestampCell);
        row.appendChild(typeCell);
        row.appendChild(detailsCell);
        return row;
    }

    function createActivityEmptyState() {
        const row = createElement("tr");
        const cell = createElement("td");
        cell.colSpan = 3;
        cell.className = "activity-empty-state";
        cell.textContent = "No activity entries found.";
        row.appendChild(cell);
        return row;
    }

    async function fetchActivityLog() {
        const query = new URLSearchParams();
        const taskIdValue = activityTaskIdInput.value.trim();
        const startValue = activityStartInput.value.trim();
        const endValue = activityEndInput.value.trim();
        const typeValue = activityTypeSelect.value;

        if (taskIdValue) {
            query.set("task", taskIdValue);
        }
        if (startValue) {
            query.set("start", startValue);
        }
        if (endValue) {
            query.set("end", endValue);
        }
        if (typeValue) {
            query.set("type", typeValue);
        }

        activityTableBody.replaceChildren();
        const loadingRow = createElement("tr");
        const loadingCell = createElement("td");
        loadingCell.colSpan = 3;
        loadingCell.className = "activity-empty-state";
        loadingCell.textContent = "Loading activity entries…";
        loadingRow.appendChild(loadingCell);
        activityTableBody.appendChild(loadingRow);

        try {
            const response = await fetch(`${API_BASE}/activity${query.toString() ? `?${query.toString()}` : ""}`);
            if (!response.ok) {
                throw new Error(`Request failed with status ${response.status}`);
            }

            const payload = await response.json();
            const entries = Array.isArray(payload) ? payload : [];
            activityTableBody.replaceChildren();
            if (entries.length === 0) {
                activityTableBody.appendChild(createActivityEmptyState());
                return;
            }

            entries.forEach(function appendActivityRow(entry) {
                activityTableBody.appendChild(createActivityRow(entry));
            });
        } catch (error) {
            console.error("Unable to load activity entries", error);
            activityTableBody.replaceChildren();
            const errorRow = createElement("tr");
            const errorCell = createElement("td");
            errorCell.colSpan = 3;
            errorCell.className = "activity-empty-state";
            errorCell.textContent = "Unable to load activity entries. Please try again.";
            errorRow.appendChild(errorCell);
            activityTableBody.appendChild(errorRow);
        }
    }

    function handleActivityLogButtonClick() {
        openActivityModal();
    }

    function handleActivityModalCloseButtonClick() {
        closeActivityModal();
    }

    function handleActivityModalCloseTriggerClick(event) {
        if (event.target === event.currentTarget) {
            closeActivityModal();
        }
    }

    function handleActivityClearFilterClick() {
        activityTaskIdInput.value = "";
        activityStartInput.value = "";
        activityEndInput.value = "";
        activityTypeSelect.value = "";
        fetchActivityLog();
    }

    function handleActivityApplyFilterClick() {
        fetchActivityLog();
    }

    function handleModalCloseButtonClick() {
        closeTaskModal();
    }

    function handleModalCloseTriggerClick(event) {
        if (event.target === event.currentTarget) {
            if (activityModalState.isOpen) {
                closeActivityModal();
            } else if (modalViewState.isOpen) {
                closeTaskModal();
            }
        }
    }

    function handleTaskFormSubmit(event) {
        submitTaskForm(event);
    }

    function handleDocumentKeyDown(event) {
        if (event.key === "Escape") {
            if (modalViewState.isOpen) {
                closeTaskModal();
            } else if (activityModalState.isOpen) {
                closeActivityModal();
            }
        }
    }

    populateSelectOptions(filterStatusSelect, STATUS_OPTIONS);
    populateSelectOptions(filterPrioritySelect, PRIORITY_OPTIONS);

    newTaskButton.onclick = handleNewTaskButtonClick;
    activityLogButton.onclick = handleActivityLogButtonClick;
    modalCloseButton.onclick = handleModalCloseButtonClick;
    modalCancelButton.onclick = handleModalCloseButtonClick;
    clearFilterButton.onclick = handleClearFilterClick;
    applyFilterButton.onclick = handleApplyFilterClick;
    activityModalCloseButton.onclick = handleActivityModalCloseButtonClick;
    activityClearFilterButton.onclick = handleActivityClearFilterClick;
    activityApplyFilterButton.onclick = handleActivityApplyFilterClick;

    document.querySelectorAll("[data-close-modal]").forEach(assignModalCloseTrigger);
    function assignModalCloseTrigger(closeTriggerElement) {
        closeTriggerElement.onclick = handleModalCloseTriggerClick;
    }

    modalForm.onsubmit = handleTaskFormSubmit;
    document.onkeydown = handleDocumentKeyDown;

    fetchTasks();
  </script>
</body>
</html>
